{% extends "base.html" %}
{% block title %}Leaderboard{% endblock %}
{% block content %}
<div class="card dashboardCard">
<h1>Leaderboard</h1>
<p class="meta">Hypothetical standings - this app tracks a single local profile, so these are sample rankings, not real users.</p>
<div class="tableContainer">
<table class="historyTable">
<thead>
<tr>
<th>#</th>
<th>Handle</th>
<th>Score</th>
<th>Solved</th>
<th>Accuracy</th>
</tr>
</thead>
<tbody id="leaderboardBody"></tbody>
</table>
</div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static',filename='leaderboard.js') }}"></script>
{% endblock %}
