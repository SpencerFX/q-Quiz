# Template only - placeholder values, safe to commit. Do NOT fill this
# in and commit it; the whole point is to stop passing secrets around
# as environment variables set by hand. Instead:
#
#   kubectl create secret generic q-quiz-secrets \
#     --namespace q-quiz \
#     --from-literal=FLASK_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=GOOGLE_CLIENT_ID="<your real client ID>"
#
# or, in a real deployment, from a proper secrets manager (Sealed
# Secrets, External Secrets Operator pulling from a cloud KMS, etc.)
# rather than either this file or plain kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: q-quiz-secrets
  namespace: q-quiz
type: Opaque
stringData:
  FLASK_SECRET_KEY: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
